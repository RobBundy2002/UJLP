name: Weekly maintenance
on:
  schedule:
    - cron: '0 14 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: weekly-maintenance
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Collect dependency reports
        run: |
          mkdir -p automation-results
          npm outdated --json > automation-results/outdated.json || test "$?" -eq 1
          npm audit --json > automation-results/audit.json || test "$?" -eq 1
      - name: Check documentation
        id: docs
        continue-on-error: true
        run: npm run docs:check
      - name: Test database permissions
        id: database
        continue-on-error: true
        run: npm run test:database
      - name: Check external and document links
        id: links
        continue-on-error: true
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config .lychee.toml README.md 'docs/**/*.md' 'src/**/*.js' https://ujlawandpolitics.org
          output: automation-results/links.md
          format: markdown
          fail: true
      - name: Update maintenance issue
        if: always()
        uses: actions/github-script@v7
        env:
          DOCS_RESULT: ${{ steps.docs.outcome }}
          DATABASE_RESULT: ${{ steps.database.outcome }}
          LINKS_RESULT: ${{ steps.links.outcome }}
        with:
          script: |
            const update = require('./.github/scripts/maintenance.cjs');
            await update({ github, context });
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maintenance-reports
          path: automation-results/
