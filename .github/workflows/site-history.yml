name: Visual site history
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: site-history-${{ github.sha }}
          path: docs/changelog-assets/history-screenshots/
          retention-days: 90
